
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-auditor-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./src:/app/src
      - ./temp_pdfs:/app/temp_pdfs
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    image: node:20-bookworm-slim
    container_name: ai-auditor-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev"
    restart: unless-stopped
    depends_on:
      - backend